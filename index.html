<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Get Well Soon Pglu ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 40px 20px;
        }

        .title {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 30px;
        }

        .title span {
            display: inline-block;
            font-size: clamp(38px, 8vw, 75px);
            font-weight: bold;
            color: #ffffff;
            animation: jump 1s ease-in-out infinite;
        }

        .title span:nth-child(1) { animation-delay: 0s; }
        .title span:nth-child(2) { animation-delay: .1s; }
        .title span:nth-child(3) { animation-delay: .2s; }
        .title span:nth-child(4) { animation-delay: .3s; }
        .title span:nth-child(5) { animation-delay: .4s; }
        .title span:nth-child(6) { animation-delay: .5s; }
        .title span:nth-child(7) { animation-delay: .6s; }
        .title span:nth-child(8) { animation-delay: .7s; }
        .title span:nth-child(9) { animation-delay: .8s; }
        .title span:nth-child(10) { animation-delay: .9s; }
        .title span:nth-child(11) { animation-delay: 1s; }
        .title span:nth-child(12) { animation-delay: 1.1s; }
        .title span:nth-child(13) { animation-delay: 1.2s; }

        @keyframes jump {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-18px);
            }
        }

        .message {
            font-size: 22px;
            line-height: 1.7;
            margin-bottom: 35px;
            color: #e9edf5;
        }

        .message strong {
            color: #f2c66d;
        }

        .surprise-text {
            font-size: 18px;
            color: #aebbd0;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 25px;
            background: #f2c66d;
            color: #07111f;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .surprise-image {
            width: 100%;
            max-width: 600px;
            border-radius: 18px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .hearts {
            font-size: 28px;
            margin-top: 30px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            50% {
                transform: scale(1.12);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            <span>G</span>
            <span>E</span>
            <span>T</span>
            <span>&nbsp;</span>
            <span>W</span>
            <span>E</span>
            <span>L</span>
            <span>L</span>
            <span>&nbsp;</span>
            <span>S</span>
            <span>O</span>
            <span>O</span>
            <span>N</span>
        </div>

        <div class="message">
            <strong>PGLU 🥺❤️</strong><br>
            Jaldi se theek ho jao! 🫠<br><br>

            Aapke liye ek bahut pyaara surprise hai mere paas... Ushki choti si jhalak 🎁✨
        </div>

        <div class="surprise-text">
            A Little Birthday Surprise 🎂👀❤️
        </div>

        <button onclick="showSurprise()">🎁 Birthday Surprise</button>

        <img 
            id="surpriseImage"
            src="images/birthday.png" 
            alt="A little surprise for you"
            class="surprise-image"
            style="display: none;"
        >

        <div class="hearts">
            ❤️ 🧿 ❤️
        </div>

    </div>

    <script>
        function showSurprise() {
            document.getElementById("surpriseImage").style.display = "block";
        }
    </script>

</body>
</html>
